<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | (aegis) Consultants</title>
    <link rel="stylesheet" href="CSS/styles.css">

    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
       (function(){
          emailjs.init("service_ylbzwtx"); // Replace with your EmailJS Public Key
       })();
    </script>
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="container nav-container">
            <h1 class="logo">(aegis)<span>Consultants</span></h1>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="Services.html">Services & Pricing</a></li>
                    <li><a href="About.html">About</a></li>
                    <li><a href="Contact.html" style="color: var(--accent);" class="btn-nav">Get a Quote</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Contact Section -->
    <section class="contact" style="padding: 5rem 0; border-top: none;">
        <div class="container contact-container">
            <h3>Start Your Project</h3>
            <p>Fill out the form below and we’ll get back to you within 24 hours.</p>
            
            <form id="inquiryForm" class="inquiry-form">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="john@example.com" required>
                </div>
                <div class="form-group">
                    <label for="service">Select Service</label>
                    <select id="service">
                        <option value="Starter Business Site">Starter Business Site (R4,900)</option>
                        <option value="Custom Software">Custom Web Application / Software</option>
                        <option value="Digital Risk Assessment">Digital Risk Assessment</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="message">Project Details</label>
                    <textarea id="message" rows="4" placeholder="Tell us about your project goals..." required></textarea>
                </div>
                <button type="submit" class="btn-primary">Submit Inquiry</button>
                <p id="formFeedback" class="feedback-msg"></p>
            </form>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; 2026 (aegis) Consultants. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
